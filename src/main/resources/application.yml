spring:
  application:
    name: zero-waste
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5543/zero-waste-db}
    username: '${DB_USER:zero-waste-user}'
    password: '${DB_PASSWORD:zero-waste-password}'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  mvc:
    apiversion:
      default: '1'
      supported: '1,2'
      use:
        path-segment: '1'

management:
  endpoint:
    health:
      show-details: "always"
  endpoints:
    web:
      exposure:
        include: "*"

app:

  prod: ${PROD:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    password: ${DEV_PASSWORD:SecurePassword123!}
jwt:
  secret: '${JWT_SECRET:your-256-bit-secret-key-here-make-it-at-least-32-bytes-long}'
  expiration: '${JWT_EXPIRATION:900000}'
refresh-token:
  expiration: '${REFRESH_TOKEN_EXPIRATION:604800}'
springdoc:
  api-docs:
    path: /api/v1/docs/api-docs
  swagger-ui:
    path: /api/v1/docs/swagger-ui.html

server:
  port: 8080
